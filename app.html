<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weatherwise - Your Personal Weather Website</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            text-align: center;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            color: black;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
        }

        button {
            background: #007bff;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .weather-info {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        canvas {
            max-width: 100%;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>🌦 Weatherwise</h1>

        <p>Your Personal Weather Website</p>

        <input
            type="text"
            id="city"
            placeholder="Enter city name"
            value="Indore"
        >

        <button onclick="getWeather()">
            Get Weather
        </button>

        <p
            id="loading"
            style="display:none; color:#007bff; font-weight:bold;"
        >
            Fetching weather data...
        </p>

        <div
            id="weatherResult"
            class="weather-info"
            style="display:none;"
        ></div>

        <canvas id="tempChart"></canvas>

        <canvas id="windChart"></canvas>

        <p
            id="prediction"
            style="font-weight:bold; margin-top:10px;"
        ></p>

    </div>

<script>

const API_KEY = "ENTER_YOUR_OPENWEATHER_API_KEY";

let tempChart = null;
let windChart = null;

function getWeather() {

    let city =
        document.getElementById("city").value;

    let weatherResult =
        document.getElementById("weatherResult");

    document.getElementById("loading").style.display =
        "block";

    fetch(
        `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
    )

    .then(response => response.json())

    .then(data => {

        document.getElementById("loading").style.display =
            "none";

        if(data.cod != 200) {

            weatherResult.innerHTML = `
                <p style="color:red;">
                    ❌ ${data.message}
                </p>
            `;

            weatherResult.style.display = "block";

            return;
        }

        weatherResult.innerHTML = `
            <h2>Weather in ${city}</h2>

            <p>
                🌡 Temperature:
                ${data.main.temp}°C
            </p>

            <p>
                💧 Humidity:
                ${data.main.humidity}%
            </p>

            <p>
                💨 Wind Speed:
                ${data.wind.speed} m/s
            </p>

            <p>
                🌤 Condition:
                ${data.weather[0].description}
            </p>
        `;

        weatherResult.style.display = "block";

        // Visualization data
        let history = {

            dates: [
                "Day 1",
                "Day 2",
                "Day 3",
                "Day 4",
                "Day 5"
            ],

            temp: [
                data.main.temp - 2,
                data.main.temp - 1,
                data.main.temp,
                data.main.temp - 3,
                data.main.temp + 1
            ],

            wind: [
                data.wind.speed - 1,
                data.wind.speed,
                data.wind.speed + 1,
                data.wind.speed,
                data.wind.speed + 2
            ]
        };

        updateCharts(history);

        predictWeather(data);

    })

    .catch(error => {

        document.getElementById("loading").style.display =
            "none";

        weatherResult.innerHTML = `
            <p style="color:red;">
                ❌ Failed to fetch weather data
            </p>
        `;

        weatherResult.style.display = "block";

        console.log(error);
    });
}



function updateCharts(history) {

    // Destroy previous charts
    if(tempChart) {
        tempChart.destroy();
    }

    if(windChart) {
        windChart.destroy();
    }

    // Temperature chart
    let tempCtx =
        document.getElementById("tempChart")
        .getContext("2d");

    tempChart = new Chart(tempCtx, {

        type: "line",

        data: {

            labels: history.dates,

            datasets: [{

                label: "Temperature (°C)",

                data: history.temp,

                borderColor: "#ff5733",

                fill: false,

                tension: 0.3
            }]
        }
    });


    // Wind chart
    let windCtx =
        document.getElementById("windChart")
        .getContext("2d");

    windChart = new Chart(windCtx, {

        type: "bar",

        data: {

            labels: history.dates,

            datasets: [{

                label: "Wind Speed (m/s)",

                data: history.wind,

                backgroundColor: "#673ab7"
            }]
        }
    });
}



function predictWeather(data) {

    let predictedTemp =
        (data.main.temp + 2).toFixed(2);

    document.getElementById("prediction")
        .innerText =
        `🌡️ Predicted Avg Temperature for Next Day: ${predictedTemp}°C`;
}

</script>

</body>
</html>
